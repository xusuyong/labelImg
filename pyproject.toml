[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nineskylabelimg"
version = "2.0.0"
description = "A graphical image annotation tool for YOLO, PascalVOC, and CreateML formats"
readme = "README.rst"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TzuTa Lin", email = "tzu.ta.lin@gmail.com"},
]
keywords = ["labelTool", "development", "annotation", "deeplearning", "yolo", "pascalvoc", "createml"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyqt6",
    "pyyaml",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]

[project.scripts]
nineskylabelimg = "NineSkyLabelImg:main"

[project.urls]
Homepage = "https://github.com/tzutalin/nineskylabelimg"

[tool.setuptools]
py-modules = ["NineSkyLabelImg"]

[tool.setuptools.packages.find]
include = ["libs*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.qrc"]
"libs" = ["resources.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes 基础检查
# I:   isort 导入排序
# UP:  pyupgrade 现代化语法
# B:   flake8-bugbear 潜在 bug
select = ["E", "F", "I", "UP", "B"]
# E501 行长度交给 ruff-format 管，B007 忽略未使用循环变量
ignore = ["E501", "B007"]
# 允许 --fix 自动处理这些「unsafe」规则
extend-safe-fixes = ["UP031"]

[tool.ruff.lint.isort]
known-third-party = ["PyQt6", "loguru", "yaml"]
known-first-party = ["libs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pre-commit]
default_stages = ["pre-commit"]
